<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waste Sorting Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Waste Sorting System Dashboard</h1>

    <section id="sensor-section">
      <h2>Sensors</h2>
      <div id="sensor-data"></div>
    </section>

    <section id="levels-section">
      <h2>Waste Levels</h2>
      <div id="waste-levels"></div>
    </section>

    <section id="bin-section">
      <h2>Bin Status</h2>
      <div id="bin-status"></div>
    </section>

    <section id="schedule-section">
      <h2>Collection Schedule</h2>
      <div id="collection-schedule"></div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
